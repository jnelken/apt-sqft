name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build (typecheck)
        run: npm run build

      - name: Test
        run: npm test -- --ci --coverage --reporters=default --reporters=jest-junit

      - name: Upload coverage artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: Extract coverage summary
        id: cov
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          node -e "const s=require('./coverage/coverage-summary.json'); const fs=require('fs'); const out=Object.entries({statements:s.total.statements.pct,branches:s.total.branches.pct,functions:s.total.functions.pct,lines:s.total.lines.pct}).map(([k,v])=>`${k}=${v}`).join('\n'); fs.appendFileSync(process.env.GITHUB_OUTPUT, out);"

      - name: Comment coverage on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const statements = '${{ steps.cov.outputs.statements }}';
            const branches = '${{ steps.cov.outputs.branches }}';
            const functions = '${{ steps.cov.outputs.functions }}';
            const lines = '${{ steps.cov.outputs.lines }}';
            const marker = '<!-- coverage-report -->';
            const body = `${marker}\n**Coverage Summary**\n- Statements: ${statements}%\n- Branches: ${branches}%\n- Functions: ${functions}%\n- Lines: ${lines}%`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
